# GitHub Actions CI for crisis-rehearsal.
#
# WHY THIS FILE IS NOT IN .github/workflows/ YET
# Pushing a workflow file requires a credential with the `workflow` scope. The
# maintainer token used for the v0.3.0 release only has repo/gist/read:org, so
# GitHub rejects the push of .github/workflows/ci.yml. The workflow is therefore
# shipped here, ready to enable:
#
#   cp docs/ci/github-actions.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "ci: enable workflow" && git push
#
# (Use a token/app with the workflow scope, or add the file through the GitHub
# web UI: Add file -> Create new file -> .github/workflows/ci.yml -> paste.)
#
# Until it is enabled, the README badge is a static `tests 90 passed` badge
# because the local evidence workstation runs the same commands by hand
# (see docs/cli.md). Everything this workflow runs is offline-testable:
# pytest, crh verify, crh stats, crh demo, crh pack validate, crh site.
name: CI

# What this workflow proves, on every push and pull request:
#   1. `pip install -e .` works on Python 3.9-3.12 with ZERO runtime dependencies;
#   2. the test suite is green (published numbers reproduced, evidence verified,
#      dossiers rendered, scenario packs validated, exit codes checked);
#   3. the three commands a reader is told to run actually run: `crh verify`,
#      `crh stats`, `crh demo` (offline, no API key, no network);
#   4. a source distribution can be built and contains the evidence pack,
#      the scenario-pack schema and the reproduction scripts.
#
# The full 90-run simulation grid is NOT part of CI: it needs a running MiroFish
# server and an LLM API key. CI only checks the evidence workstation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Test suite
        run: pytest -q

      - name: Evidence integrity (crh verify)
        run: crh verify

      - name: Published numbers (crh stats)
        run: crh stats

      - name: Offline demo (crh demo, <10 s, no API key)
        run: crh demo --out demo_out

      - name: Scenario pack schema + example
        run: |
          crh pack validate schema/examples/example_enterprise_pack.json
          crh pack init --id ci-smoke-pack --name "CI smoke pack" --out ci_packs
          crh pack validate ci_packs/ci-smoke-pack.json

      - name: Static dossier site (crh site)
        run: crh site --out site

      - name: Upload demo dossiers (reviewable without installing anything)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-dossiers-py${{ matrix.python-version }}
          path: demo_out/
          if-no-files-found: error

  windows:
    name: smoke · Windows · Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite (UTF-8 console, same as the docs)
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q

      - name: Commands a reader is told to run
        env:
          PYTHONIOENCODING: utf-8
        run: |
          crh verify
          crh stats
          crh demo --out demo_out

  build:
    name: build · sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the sdist carries the evidence pack, schema and scripts
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          echo "sdist: ${SDIST}"
          for required in \
            data/evidence.sha256 \
            data/events.csv \
            data/repeat_v02/scores.jsonl \
            data/seeds/1.md \
            schema/scenario_pack.schema.json \
            crisis_rehearsal/schema/scenario_pack.schema.json \
            scripts/ci_stats.py \
            scripts/sta_stats.py \
            pyproject.toml \
            README.md ; do
            if ! tar -tzf "${SDIST}" | grep -q "/${required}$"; then
              echo "ERROR: sdist is missing ${required}"
              exit 1
            fi
          done
          echo "OK: sdist contains every required file"

      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/python -m pip install --upgrade pip
          /tmp/venv-wheel/bin/python -m pip install dist/*.whl
          cd /tmp && /tmp/venv-wheel/bin/crh --version
          # a wheel on its own has no evidence pack; --repo points at the checkout
          /tmp/venv-wheel/bin/crh verify --repo "$GITHUB_WORKSPACE"
          /tmp/venv-wheel/bin/crh stats --repo "$GITHUB_WORKSPACE" > /tmp/stats.txt
          grep -q "82.2%" /tmp/stats.txt
          /tmp/venv-wheel/bin/crh demo --repo "$GITHUB_WORKSPACE" --out /tmp/demo_out

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
